name: Publish

on:
  # Se publica al crear un release en GitHub: el tag (v1.0.0) define la versión
  release:
    types: [created]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish package
        # ${GITHUB_REF_NAME#v} le saca la "v" al tag: v1.0.0 -> 1.0.0
        run: ./gradlew build publish -PreleaseVersion=${GITHUB_REF_NAME#v}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
